<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#140f24">
<title>BallPass 7–9</title>
<style>
  :root {
    --bg: #140f24; --panel: #1f1836; --text: #f4f1fa; --muted: #a59cc0; --line: #2f2650;
    --accent: #8b5cf6; --ok: #16a34a; --bad: #dc2626; --warn: #d97706; --wait: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); }
  .logo { font-weight: 800; letter-spacing: 1px; font-size: 18px; }
  .logo span { color: var(--accent); }
  .who { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { font-size: 13px; font-weight: 700; background: var(--panel); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: #22c55e; } .dot.off { background: var(--bad); }

  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #reader { width: 100%; max-width: 520px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #000; min-height: 260px; }
  #reader video { width: 100% !important; height: auto !important; display: block; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.4; }
  .notice { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; line-height: 1.5; }
  .notice b { color: var(--text); }

  button { font: inherit; border: 0; border-radius: 14px; cursor: pointer; }
  .btn { min-height: 56px; padding: 0 20px; font-size: 18px; font-weight: 700; background: var(--panel); color: var(--text); border: 1px solid var(--line); width: 100%; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn:disabled { opacity: .6; }

  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; min-height: 52px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 0 14px; font-size: 17px; }
  .search .btn { width: auto; min-height: 52px; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .item { display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); }
  .item .main { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; font-size: 16px; }
  .item .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chip { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
  .chip.ok { background: rgba(22,163,74,.2); color: #4ade80; }
  .chip.bad { background: rgba(220,38,38,.2); color: #f87171; }
  .chip.warn { background: rgba(217,119,6,.25); color: #fbbf24; }

  nav { display: flex; gap: 8px; padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  nav button { flex: 1; min-height: 48px; background: transparent; color: var(--muted); font-weight: 700; font-size: 16px; }
  nav button.active { background: var(--panel); color: var(--text); }

  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: center;
    padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); text-align: center; gap: 10px; }
  #overlay.ok { background: var(--ok); } #overlay.bad { background: var(--bad); }
  #overlay.warn { background: var(--warn); } #overlay.wait { background: var(--wait); }
  .o-icon { font-size: 72px; font-weight: 800; line-height: 1; }
  .o-title { font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
  .o-name { font-size: 28px; font-weight: 700; margin-top: 8px; word-break: break-word; }
  .o-meta { font-size: 18px; opacity: .9; }
  .o-detail { font-size: 16px; opacity: .9; margin-top: 4px; }
  .o-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; width: 100%; max-width: 420px; align-self: center; }
  .o-actions .btn { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); }
  .o-actions .btn.primary { background: #fff; color: #14532d; border-color: #fff; min-height: 72px; font-size: 24px; }
</style>
</head>
<body>
<header>
  <div class="logo">Ball<span>Pass</span> 7–9</div>
  <div class="who" id="who"></div>
  <div class="stats" id="stats" hidden></div>
  <div class="dot" id="dot" title="Связь с сервером"></div>
</header>

<main>
  <section id="viewLogin" hidden>
    <div class="notice" id="loginText"></div>
  </section>

  <section id="viewScan" hidden>
    <div id="reader"></div>
    <p class="hint" id="camHint">Наведите камеру на QR-код билета</p>
    <button class="btn primary" id="btnCamera" hidden>Включить камеру</button>
  </section>

  <section id="viewSearch" hidden>
    <div class="notice" style="margin-bottom:12px">Ручная проверка: начните вводить фамилию или номер (R-0001) — список появится сразу. Только что зарегистрировался и его нет в списке? Нажмите «Найти». «Ждёт оплаты» — проверьте чек и пропустите.</div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Фамилия или R-0001" enterkeyhint="search">
      <button class="btn primary" type="submit">Найти</button>
    </form>
    <div class="results" id="results" style="margin-top:12px"></div>
  </section>
</main>

<nav id="tabs" hidden>
  <button id="tabScan" class="active">Сканер</button>
  <button id="tabSearch">Поиск</button>
  <button id="tabExit" style="flex:0 0 auto;padding:0 14px">Выйти</button>
</nav>

<div id="overlay" hidden>
  <div class="o-icon" id="oIcon"></div>
  <div class="o-title" id="oTitle"></div>
  <div class="o-name" id="oName"></div>
  <div class="o-meta" id="oMeta"></div>
  <div class="o-detail" id="oDetail"></div>
  <div class="o-actions" id="oActions"></div>
</div>

<script src="html5-qrcode.min.js"></script>
<script>
'use strict';

// ⬇ Paste your Apps Script Web App URL here (Deploy → Manage deployments → Web app URL).
const API_URL = 'https://script.google.com/macros/s/AKfycbzA3sOiV_dOi4HGbPtqpYXZc9lqVlKN1tgjMvKsuOTV6QHhC1R_Lm5h10OIZGGg7JQc/exec';

// Different value per event page, so pages on the same github.io domain don't overwrite each other's key.
const EVENT_ID = '7-9';
const KEY_STORAGE = 'ballpass_key' + (EVENT_ID ? '_' + EVENT_ID : '');
const WHO_STORAGE = 'ballpass_who';
const TOKEN_RE = /^BP-[0-9a-f]{32}$/;
const REQUEST_TIMEOUT_MS = 12000;
const SAME_CODE_IGNORE_MS = 4000; // counted from when the result screen closes
const AUTO_NEXT_OK_MS = 1200;
const AUTO_NEXT_BAD_MS = 4000;
const PING_EVERY_MS = 45000; // also keeps the server warm

const VIEWS = {
  CHECKING: { tone: 'wait', icon: '…', title: 'Проверка…' },
  ADMITTING: { tone: 'wait', icon: '…', title: 'Проверка…' },
  VALID: { tone: 'ok', icon: '✓', title: 'Билет действителен' },
  ADMITTED: { tone: 'ok', icon: '✓', title: 'Проходите!' },
  USED: { tone: 'bad', icon: '✕', title: 'Уже использован' },
  INVALID: { tone: 'bad', icon: '✕', title: 'Недействительный билет' },
  NOT_PAID: { tone: 'bad', icon: '✕', title: 'Оплата не подтверждена' },
  REVOKED: { tone: 'bad', icon: '✕', title: 'Билет отозван' },
  NOT_BALLPASS: { tone: 'bad', icon: '✕', title: 'Это не билет BallPass' },
  PAY_CHECK: { tone: 'warn', icon: '₸', title: 'Проверьте чек' },
  ERROR: { tone: 'warn', icon: '!', title: 'Повторите' },
  DENIED: { tone: 'warn', icon: '!', title: 'Доступ отключён' },
};

const state = {
  key: null, me: '', who: '', tab: 'scan', busy: false,
  lastCode: '', lastCodeAt: 0, scanner: null, cameraOn: false,
  uncertainAdmit: '', stats: null, wakeLock: null, closable: false,
  roster: null, shown: null, shownHint: '',
};

const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- storage
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function readKeyFromLink() {
  const m = location.hash.match(/k=([0-9a-f]{64})/);
  if (m) {
    store(KEY_STORAGE, m[1]);
    history.replaceState(null, '', location.pathname + location.search); // hide key from the address bar
    return m[1];
  }
  return load(KEY_STORAGE);
}

// ---------------------------------------------------------------- API
async function api(action, payload) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // simple request: no CORS preflight
      body: JSON.stringify(Object.assign({ action: action, key: state.key, who: state.who }, payload || {})),
      signal: ctrl.signal,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('Сервер вернул не JSON — проверьте развёртывание (доступ: Anyone)'); }
    setOnline(true);
    return data;
  } catch (err) {
    setOnline(false);
    if (err.name === 'AbortError') throw new Error('Сервер не ответил за ' + REQUEST_TIMEOUT_MS / 1000 + ' с');
    if (err instanceof TypeError) throw new Error('Нет связи с сервером');
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function setOnline(on) { $('dot').className = 'dot ' + (on ? 'on' : 'off'); }

function setStats(stats) {
  if (!stats) return;
  state.stats = stats;
  $('stats').hidden = false;
  $('stats').textContent = 'Вошло ' + stats.admitted + ' / ' + stats.approved;
}

async function ping() {
  try {
    const r = await api('ping');
    if (r.status === 'DENIED') return showDenied(r.message);
    if (r.status === 'OK') {
      state.me = r.organizer || '';
      $('who').textContent = (state.who ? state.who + ' · ' : '') + state.me;
      setStats(r.stats);
      setRoster(r.people);
    }
    return r;
  } catch (e) {
    return null;
  }
}

// ---------------------------------------------------------------- feedback
let audioCtx = null;
function unlockAudio() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function feedback(tone) {
  if (tone === 'wait') return;
  const ok = tone === 'ok';
  try {
    if (audioCtx) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = ok ? 'sine' : 'square';
      o.frequency.value = ok ? 880 : 200;
      g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + (ok ? 0.12 : 0.4));
    }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 60 : [150, 80, 150]);
}

// ---------------------------------------------------------------- overlay
let overlayTimer = null;

/** autoCloseMs: go back to the camera by itself (green / red); tapping the screen closes it sooner. */
function showResult(kind, data, actions, detailOverride, autoCloseMs) {
  clearTimeout(overlayTimer);
  state.closable = !!autoCloseMs;
  if (autoCloseMs) overlayTimer = setTimeout(next, autoCloseMs);
  const v = VIEWS[kind] || VIEWS.ERROR;
  const ov = $('overlay');
  ov.className = v.tone;
  $('oIcon').textContent = v.icon;
  $('oTitle').textContent = v.title;
  $('oName').textContent = (data && data.name) || '';
  const meta = [];
  if (data && data.klass) meta.push('Класс ' + data.klass);
  if (data && data.regId) meta.push(data.regId);
  $('oMeta').textContent = meta.join(' · ');
  let detail = detailOverride || '';
  if (!detail && kind === 'USED' && data) detail = 'Вход в ' + (data.entryTime || '?') + (data.admittedBy ? ' · ' + data.admittedBy : '');
  if (!detail && kind === 'NOT_PAID') detail = 'Обратитесь к организатору';
  $('oDetail').textContent = detail;

  const box = $('oActions');
  box.textContent = '';
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn' + (a.primary ? ' primary' : '');
    b.textContent = a.label;
    b.addEventListener('click', () => { unlockAudio(); a.onClick(b); });
    box.appendChild(b);
  });
  ov.hidden = false;
  feedback(v.tone);
}

function next() {
  clearTimeout(overlayTimer);
  $('overlay').hidden = true;
  state.busy = false;
  state.lastCodeAt = Date.now(); // the same QR still in front of the camera is ignored for a moment
}

const NEXT = { label: 'Следующий', onClick: next };

// ---------------------------------------------------------------- flows
function onScan(text) {
  if (state.busy || state.tab !== 'scan' || !$('overlay').hidden) return;
  const code = String(text || '').trim();
  if (code === state.lastCode && Date.now() - state.lastCodeAt < SAME_CODE_IGNORE_MS) return;
  state.lastCode = code;
  state.lastCodeAt = Date.now();
  if (!TOKEN_RE.test(code)) {
    state.busy = true;
    showResult('NOT_BALLPASS', null, [NEXT], '', AUTO_NEXT_BAD_MS);
    return;
  }
  runAdmit({ token: code }); // QR: one call — a valid ticket is admitted right away
}

async function runCheck(ref) {
  state.busy = true;
  showResult('CHECKING', null, []);
  let r;
  try {
    r = await api('check', ref);
  } catch (err) {
    showResult('ERROR', null, [{ label: 'Повторить', primary: true, onClick: () => runCheck(ref) }, NEXT], err.message);
    return;
  }
  if (r.status === 'DENIED') return showDenied(r.message);
  rememberStatus(r);
  if (r.status === 'NOT_PAID' && r.pending && ref.regId) return showPayCheck(r);
  if (r.status === 'VALID') {
    showResult('VALID', r, [
      { label: 'Пропустить', primary: true, onClick: () => runAdmit(ref) },
      { label: 'Отмена', onClick: next },
    ]);
    return;
  }
  if (r.status === 'ERROR') {
    showResult('ERROR', null, [{ label: 'Повторить', primary: true, onClick: () => runCheck(ref) }, NEXT], r.message);
    return;
  }
  showResult(r.status, r, [NEXT], '', AUTO_NEXT_BAD_MS);
}

/**
 * Validates and admits in one server call. On a timeout or "busy" it retries once by itself —
 * safe, because a ticket this volunteer already admitted comes back as USED with self = true.
 */
async function runAdmit(ref, isRetry) {
  state.busy = true;
  const refKey = JSON.stringify(ref);
  showResult('ADMITTING', null, []);
  const retry = { label: 'Повторить', primary: true, onClick: () => runAdmit(ref) };
  let r;
  try {
    r = await api('admit', ref);
  } catch (err) {
    state.uncertainAdmit = refKey; // the server may or may not have recorded it
    if (!isRetry) return runAdmit(ref, true);
    showResult('ERROR', null, [retry, NEXT], err.message + '. Не пропускайте, пока не станет зелёным.');
    return;
  }
  if (r.status === 'DENIED') return showDenied(r.message);
  if (r.status !== 'ERROR') rememberStatus(r);

  const admittedByMeEarlier = r.status === 'USED' && r.self === true && state.uncertainAdmit === refKey;
  if (r.status === 'ADMITTED' || admittedByMeEarlier) {
    state.uncertainAdmit = '';
    if (state.stats && r.status === 'ADMITTED') setStats({ admitted: state.stats.admitted + 1, approved: state.stats.approved });
    showResult('ADMITTED', r, [], admittedByMeEarlier ? 'Вход уже был отмечен вами в ' + r.entryTime : 'Вход ' + (r.entryTime || ''), AUTO_NEXT_OK_MS);
    return;
  }
  if (r.status === 'ERROR') {
    state.uncertainAdmit = refKey;
    if (!isRetry) return runAdmit(ref, true);
    showResult('ERROR', null, [retry, NEXT], r.message);
    return;
  }
  state.uncertainAdmit = '';
  showResult(r.status, r, [NEXT], '', AUTO_NEXT_BAD_MS);
}

// ---------------------------------------------------------------- search
// The list from the last ping is kept in memory (never stored), so typing filters instantly.
// «Найти» asks the server — for someone approved in the last minute. Admission is always re-checked by the server.
const SEARCH_LIMIT = 20;

function toPerson(p) {
  return { regId: p.regId, name: p.name || '', klass: p.klass || '', status: p.status, entryTime: p.entryTime || '', admittedBy: p.admittedBy || '', pending: !!p.pending };
}

function setRoster(people) {
  if (!Array.isArray(people)) return;
  state.roster = people.map(p => toPerson({ regId: p.r, name: p.n, klass: p.k, status: p.s, entryTime: p.t, admittedBy: p.b, pending: p.p }));
  refreshResults();
}

/** Puts fresher server answers into the list; returns the list entries. */
function mergeIntoRoster(items) {
  state.roster = state.roster || [];
  return items.map(item => {
    const p = toPerson(item);
    const i = state.roster.findIndex(x => x.regId === p.regId);
    if (i === -1) state.roster.push(p); else state.roster[i] = p;
    return p;
  });
}

/** Updates one person's status after a check/admit answer. */
function rememberStatus(r) {
  if (!state.roster || !r || !r.regId) return;
  const p = state.roster.find(x => x.regId === r.regId);
  if (!p) return;
  p.status = r.status === 'ADMITTED' ? 'USED' : r.status;
  p.pending = p.status === 'NOT_PAID' && !!r.pending;
  if (p.status === 'USED') { p.entryTime = r.entryTime || p.entryTime; p.admittedBy = r.admittedBy || p.admittedBy; }
  refreshResults();
}

function localSearch() {
  const q = $('searchInput').value.trim().toLowerCase();
  if (q.length < 2) { renderResults(null); return; }
  if (!state.roster) { renderResults(null, 'Список ещё не загрузился — нажмите «Найти»'); return; }
  const found = state.roster.filter(p => p.name.toLowerCase().indexOf(q) !== -1 || p.regId.toLowerCase() === q);
  renderResults(found.slice(0, SEARCH_LIMIT), 'Нет в списке — нажмите «Найти», проверю на сервере');
}

async function runSearch(e) {
  e.preventDefault();
  const q = $('searchInput').value.trim();
  if (q.length < 2) { renderResults(null, 'Введите минимум 2 буквы'); return; }
  renderResults(null, 'Поиск на сервере…');
  let r;
  try { r = await api('search', { query: q }); } catch (err) { renderResults(null, err.message); return; }
  if (r.status === 'DENIED') return showDenied(r.message);
  if (r.status !== 'OK') { renderResults(null, r.message || 'Ошибка'); return; }
  renderResults(mergeIntoRoster(r.results), 'Ничего не найдено');
}

/** list = null shows only the hint; otherwise the people (or emptyHint if none). */
function renderResults(list, emptyHint) {
  state.shown = list ? list.map(p => p.regId) : null;
  state.shownHint = emptyHint || '';
  const box = $('results');
  box.textContent = '';
  if (!list || !list.length) { if (emptyHint) box.appendChild(hint(emptyHint)); return; }
  list.forEach(item => {
    const b = document.createElement('button');
    b.className = 'item';
    const main = document.createElement('div'); main.className = 'main';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = item.name || '(без имени)';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = 'Класс ' + item.klass + ' · ' + item.regId + (item.status === 'USED' ? ' · вход ' + item.entryTime : '');
    main.append(name, meta);
    const chip = document.createElement('span');
    const awaiting = item.status === 'NOT_PAID' && item.pending;
    chip.className = 'chip ' + (item.status === 'VALID' ? 'ok' : awaiting ? 'warn' : 'bad');
    chip.textContent = awaiting ? 'ждёт оплаты'
      : { VALID: 'можно', USED: 'уже вошёл', NOT_PAID: 'отклонено', REVOKED: 'отозван', INVALID: 'нет билета' }[item.status] || item.status;
    b.append(main, chip);
    b.addEventListener('click', () => pickResult(item));
    box.appendChild(b);
  });
}

/** Re-draws the shown results with fresh statuses (after a ping or an admission). */
function refreshResults() {
  if (!state.shown || !state.roster) return;
  const list = state.shown.map(id => state.roster.find(p => p.regId === id)).filter(Boolean);
  renderResults(list, state.shownHint);
}

function pickResult(item) {
  unlockAudio();
  if (item.status === 'VALID') {
    // No extra call: «Пропустить» goes straight to admit, which re-checks on the server.
    state.busy = true;
    showResult('VALID', item, [
      { label: 'Пропустить', primary: true, onClick: () => runAdmit({ regId: item.regId }) },
      { label: 'Отмена', onClick: next },
    ]);
    return;
  }
  if (item.status === 'NOT_PAID' && item.pending) { showPayCheck(item); return; }
  runCheck({ regId: item.regId }); // e.g. "отклонено" — ask the server, the status may have changed
}

/** Payment not approved in the sheet yet: the volunteer checks the receipt on the student's phone. */
function showPayCheck(item) {
  state.busy = true;
  showResult('PAY_CHECK', item, [
    { label: 'Чек проверен — пропустить', primary: true, onClick: () => runAdmit({ regId: item.regId, paidAtDoor: true }) },
    { label: 'Отмена', onClick: next },
  ], 'Оплата не подтверждена в таблице. Посмотрите чек на телефоне ученика: сумма и дата.');
}

function hint(text) { const p = document.createElement('p'); p.className = 'hint'; p.textContent = text; return p; }

// ---------------------------------------------------------------- camera
async function startCamera() {
  $('btnCamera').hidden = true;
  if (!window.Html5Qrcode) { cameraError('Библиотека сканера не загрузилась. Обновите страницу.'); return; }
  if (state.cameraOn) return;
  try {
    state.scanner = state.scanner || new Html5Qrcode('reader', {
      verbose: false,
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    await state.scanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
      onScan,
      () => {}
    );
    state.cameraOn = true;
    $('camHint').textContent = 'Наведите камеру на QR-код билета';
    keepScreenOn();
  } catch (err) {
    cameraError('Нет доступа к камере (' + (err && err.name ? err.name : err) + '). Разрешите камеру для этого сайта в настройках браузера и нажмите кнопку. ' +
      'Пока можно пользоваться вкладкой «Поиск».');
  }
}

function cameraError(msg) {
  $('camHint').textContent = msg;
  $('btnCamera').hidden = false;
}

async function keepScreenOn() {
  try { if ('wakeLock' in navigator && !state.wakeLock) state.wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  if (state.wakeLock) state.wakeLock.addEventListener('release', () => { state.wakeLock = null; });
}

// ---------------------------------------------------------------- screens
function showTab(tab) {
  state.tab = tab;
  $('viewScan').hidden = tab !== 'scan';
  $('viewSearch').hidden = tab !== 'search';
  $('tabScan').classList.toggle('active', tab === 'scan');
  $('tabSearch').classList.toggle('active', tab === 'search');
  if (tab === 'search') setTimeout(() => $('searchInput').focus(), 50);
}

function showLogin(html) {
  $('viewLogin').hidden = false;
  $('viewScan').hidden = true;
  $('viewSearch').hidden = true;
  $('tabs').hidden = true;
  $('loginText').innerHTML = html;
}

function showDenied(message) {
  clearTimeout(overlayTimer);
  $('overlay').hidden = true;
  state.busy = true;
  stopCamera();
  showLogin('<b>Доступ отключён.</b><br>' + escapeHtml(message || 'Ссылка недействительна.') +
    '<br><br>Попросите у организатора новую личную ссылку и откройте её на этом телефоне.');
}

function stopCamera() {
  if (state.scanner && state.cameraOn) { state.scanner.stop().catch(() => {}); state.cameraOn = false; }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/** Asks the volunteer's name once per phone (shown in "Admitted By"). */
function askName() {
  return new Promise(resolve => {
    showLogin('<b>Как вас зовут?</b><br>Имя будет записано рядом с каждым входом, который вы отметите.' +
      '<form id="nameForm" class="search" style="margin-top:12px" autocomplete="off">' +
      '<input id="nameInput" maxlength="30" placeholder="Например: Айдана" enterkeyhint="done">' +
      '<button class="btn primary" type="submit">Готово</button></form>');
    const input = $('nameInput');
    setTimeout(() => input.focus(), 50);
    $('nameForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = input.value.replace(/\s+/g, ' ').trim().slice(0, 30);
      if (name.length < 2) { input.focus(); return; }
      store(WHO_STORAGE, name);
      $('viewLogin').hidden = true;
      resolve(name);
    });
  });
}

function logout() {
  if (!confirm('Выйти? Чтобы снова войти, понадобится ссылка BallPass.')) return;
  store(KEY_STORAGE, null);
  store(WHO_STORAGE, null);
  state.key = null;
  state.who = '';
  stopCamera();
  showLogin('Вы вышли. Откройте свою личную ссылку BallPass, чтобы войти снова.');
}

// ---------------------------------------------------------------- start
async function init() {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) {
    showLogin('<b>Сканер не настроен.</b><br>Вставьте адрес Web App в <code>API_URL</code> в index.html.');
    return;
  }
  state.key = readKeyFromLink();
  if (!state.key) {
    showLogin('<b>Нужна личная ссылка.</b><br>Откройте на этом телефоне ссылку BallPass, которую вам прислал организатор. ' +
      'Её нельзя пересылать другим.');
    return;
  }
  state.who = load(WHO_STORAGE) || await askName();
  $('who').textContent = 'Подключение…';
  const r = await ping();
  if (r && r.status === 'DENIED') return;
  if (!r) $('who').textContent = 'Нет связи с сервером';

  $('tabs').hidden = false;
  showTab('scan');
  startCamera();
  setInterval(() => { if (document.visibilityState === 'visible') ping(); }, PING_EVERY_MS);
}

$('btnCamera').addEventListener('click', () => { unlockAudio(); startCamera(); });
$('tabScan').addEventListener('click', () => { unlockAudio(); showTab('scan'); });
$('tabSearch').addEventListener('click', () => { unlockAudio(); showTab('search'); });
$('tabExit').addEventListener('click', logout);
$('overlay').addEventListener('click', e => { if (state.closable && !e.target.closest('button')) next(); });
$('searchForm').addEventListener('submit', runSearch);
$('searchInput').addEventListener('input', localSearch);
document.addEventListener('click', unlockAudio, { once: true });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepScreenOn(); if (state.key) ping(); }
});

init();
</script>
</body>
</html>
